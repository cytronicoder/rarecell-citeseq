[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarecell-citeseq"
version = "0.1.0"
description = "CPU-friendly rare-cell preservation benchmark scaffold for CITE-seq data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zeyu Yao" }
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "scanpy",
    "anndata",
    "muon",
    "mudata",
    "igraph",
    "leidenalg",
    "pytest",
    "jupyter",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel"]
scvi = ["scvi-tools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
